<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">sandforge --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">sandforge 0.2.0 — sandbox templates with a trust envelope, validated and booted in E2B</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Usage:</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">  sandforge list                         the templates: id, runtime, egress, timeout</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">  sandforge show &lt;id&gt;                    print a template's JSON</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  sandforge validate [&lt;templates dir&gt;]   check every template: schema, trust rules, files</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  sandforge pick &quot;&lt;use case&gt;&quot; [--json]   pick the runtime and template for a task</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  sandforge plan &lt;id|path&gt; [--json]      the E2B options and probes a boot would use (creates nothing)</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">  sandforge boot &lt;id|path&gt; [--json]      boot it in a live E2B microVM, run the probes, kill the VM</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">                                         (needs E2B_API_KEY and the optional e2b package; one short sandbox)</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">  sandforge recall &quot;&lt;query&gt;&quot;             search sandforge's own memory, skills and templates</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">  sandforge --version | --help</text>
<text x="24" y="326" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">MCP server: sandforge-mcp (sandforge_validate, sandforge_dispatch, sandforge_list_templates,</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">            sandforge_get_template, sandforge_plan)</text>
</svg>
